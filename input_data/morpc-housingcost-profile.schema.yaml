fields:
  - name: GEOIDFQ
    type: string
    description: 'Unique identifier for the geography as issued by MORPC.  These are identical to fully-qualified Census-issued GEOIDs for Census geographies.'
  - name: NAME
    type: string
    description: 'Name of the geography.'    
  - name: Year
    type: year
    description: 'Year for which the variables are summarized.'
  - name: Number of Sales
    type: integer
    description: 'Number of sales that are accounted for in the summary'
  - name: Median Sales Price
    type: number
    description: 'Median home sale price for the geography, year-of-sale dollars'
  - name: Median Sales Price MOE
    type: number
    description: '90% measurement of error for sales price'
  - name: Median Household Income (MSA)
    type: integer
    description: 'Median income for residents in Columbus MSA, year-of-sale dollars'
  - name: Median Household Income MOE (MSA)
    type: number
    description: '90% measurement of error of household income.'
  - name: Sales Price to Income Index (MSA)
    type: number
    description: 'Median sales price of geography / median household income (MSA), year-of-sale dollars'
  - name: Median Sales Price (2024 Dollars)
    type: number
    description: 'Median sales price adjusted for inflation to year of most recent data (2024)'
  - name: Median Household Income (MSA, 2024 Dollars)
    type: number
    description: 'Median household income adjusted for inflation to year of most recent data (2024)'
missingValues:
  - ''
primaryKey:
  - GEOIDFQ
  - Year
   