fields:
  - name: GEO_ID
    type: string
    description: Geographic ID
  - name: NAME
    type: string
    description: Name of geography
  - name: reference_period
    type: year
    description: The year for the index.
  - name: Number of Sales
    type: number
    description: The number of houses sold in the year in the geography
  - name: Median Sale Price
    type: number
    description: The median sale price for all sale for the year in the given geography
  - name: Median Sale Price MOE
    type: number
    description: the error associated with the median sale price
  - name: Median Household Income (Columbus MSA)
    type: number
    description: The median household income for the entire region of interest
  - name: Sales Price to Income Index (MORPC 15-county region)
    type: number
    description: Home sale price for the geography divided by median household income
      for the Columbus MSA
  - name: Median Sale Price (2024 Dollars)
    type: number
    description: Home sale price adjusted for inflation to most recent year in data
  - name: Median Household Income (Columbus MSA, 2024 Dollars)
    type: number
    description: Median household income for entire region of interest adjusted to
      most recent year in data
  - name: Percent Change in Median Sale Price (2024 Dollars)
    type: number
    description: The percent change in median sale price from the base year to the
      year of observation
  - name: Percent Change in Median Household Income (Columbus MSA, 2024 Dollars)
    type: number
    description: The percent change in median household income from the base year
      to the year of observation
missingValues:
  - ''
primaryKey:
  - GEO_ID
  - reference_period
